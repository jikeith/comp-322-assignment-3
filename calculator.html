<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JavaScript Calculator</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      color: #222;
      margin: 40px;
    }

    h1 {
      color: #2c3e50;
    }

    table {
      border-collapse: collapse;
      width: 60%;
      margin-bottom: 30px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px 14px;
      text-align: center;
    }

    th {
      background-color: #2c3e50;
      color: #fff;
    }

    tr:nth-child(even) {
      background-color: #eef1f4;
    }

    .error {
      color: #c0392b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Simple JavaScript Calculator</h1>
  <p>Follow the prompts to enter two numbers and an operator. Click "Cancel" on any prompt to stop and see the summary.</p>

  <!-- All of the logic lives in calculator.js -->
  <script src="calculator.js"></script>
</body>
</html>
